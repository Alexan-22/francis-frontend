<section class="container-page max-w-xl py-14"><h1 class="section-title">Crear cuenta</h1><form class="mt-8 space-y-5" [formGroup]="form" (ngSubmit)="registrar()"><label class="block">Nombres<input formControlName="nombres" class="field mt-2" autocomplete="given-name"></label><label class="block">Apellidos<input formControlName="apellidos" class="field mt-2" autocomplete="family-name"></label><label class="block">Correo<input formControlName="correo" type="email" class="field mt-2" autocomplete="email"></label><label class="block">Contraseña<input formControlName="contrasena" type="password" class="field mt-2" autocomplete="new-password"></label><label class="block">Confirmar contraseña<input formControlName="confirmacion" type="password" class="field mt-2" autocomplete="new-password"></label><p class="text-sm text-stone-600">Los requisitos finales de contraseña dependen del backend.</p><button class="btn w-full" [disabled]="form.invalid||cargando()">Crear cuenta</button><p role="alert">{{error()}}</p><p aria-live="polite">{{mensaje()}}</p></form><a routerLink="/login" class="mt-6 inline-block underline">Volver al inicio de sesión</a></section>
