<section class="container-page max-w-xl py-14"><h1 class="section-title">Iniciar sesión</h1><p class="mt-4 text-stone-600">Inicia sesión para ver tus pedidos o acceder a la administración.</p>
<form class="mt-8 space-y-5" [formGroup]="formulario" (ngSubmit)="ingresar()"><div><label for="correo" class="mb-2 block">Correo electrónico</label><input id="correo" type="email" class="field" autocomplete="username" formControlName="correo"></div><div><label for="clave" class="mb-2 block">Contraseña</label><input id="clave" type="password" class="field" autocomplete="current-password" formControlName="clave"></div><button class="btn w-full" [disabled]="formulario.invalid||cargando()">{{cargando()?'Ingresando...':'Ingresar'}}</button><p role="alert">{{error()}}</p></form><p class="mt-6">¿No tienes cuenta? <a routerLink="/registro" class="underline">Regístrate</a></p></section>
